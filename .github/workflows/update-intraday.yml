name: Update intraday

# 정규장(09:00~15:30 KST, 평일) 동안 정확히 10분마다 시세를 받아 사이트에 반영한다.
#
# 왜 cron 을 10분마다 걸지 않는가:
#   GitHub Actions 의 schedule 은 정시 보장이 없다. 수 분~수십 분 밀리고,
#   부하가 높으면 아예 건너뛴다. "10분마다"가 실제로는 13분, 27분, 누락이 된다.
#   그래서 워크플로 하나를 오래 살려 두고 그 안에서 다음 10분 눈금까지
#   sleep 했다 깨는 방식을 쓴다(scripts/wait_next_tick.py).
#   갱신 시각이 벽시계 기준 :00 :10 :20 … 으로 고정된다.
#
# 왜 교대(shift)가 3개인가:
#   Actions 잡 하나의 최대 실행 시간이 6시간인데 장은 6시간 30분이다.
#   또 잡이 죽어도 그 교대만 잃도록 나눠 둔다.
#   각 교대는 담당 구간이 시작되기 15분 전에 떠서(= cron 지연 흡수)
#   첫 눈금까지 기다린다. 그보다 늦게 떴으면 지나간 눈금은 건너뛴다.
#
# 소스 브랜치에는 커밋하지 않는다. 하루 40번 커밋하면 히스토리가 못 쓰게 되고,
# 사이트가 읽는 건 gh-pages 에 올라간 파일이기 때문이다.
# 소스 브랜치의 docs/data 는 마감 후 도는 update-data.yml 이 하루 한 번 갱신한다.
on:
  schedule:
    # 아래 시각은 UTC. KST = UTC+9 (23시대 cron 의 요일은 하루 앞이라 0-4).
    - cron: "45 23 * * 0-4" # 08:45 KST → 09:00~11:20 담당
    - cron: "15 2 * * 1-5" #  11:15 KST → 11:30~13:20 담당
    - cron: "15 4 * * 1-5" #  13:15 KST → 13:30~15:30 담당
  workflow_dispatch:
    inputs:
      until:
        description: "몇 시(KST HH:MM)까지 10분마다 돌릴지"
        default: "15:30"

permissions:
  contents: write

concurrency:
  # 교대끼리, 그리고 마감 후 전체 수집(update-data.yml)과 gh-pages push 가
  # 겹치지 않도록 묶는다. 앞 교대가 끝나야 다음 교대가 시작한다.
  group: data-publish
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 가장 긴 교대(08:45 → 11:20)에 마무리 여유를 더한 값.
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decide shift window
        id: shift
        run: |
          case "${{ github.event.schedule }}" in
            "45 23 * * 0-4") until_kst="11:20" ;;
            "15 2 * * 1-5")  until_kst="13:20" ;;
            "15 4 * * 1-5")  until_kst="15:30" ;;
            *)               until_kst="${{ github.event.inputs.until || '15:30' }}" ;;
          esac
          echo "until=$until_kst" >> "$GITHUB_OUTPUT"
          echo "이번 교대: $until_kst KST 까지"

      - name: Tick every 10 minutes until shift end
        env:
          UNTIL: ${{ steps.shift.outputs.until }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          # 이미 배포돼 있는 데이터를 받아 둔다. 매 눈금마다 이것과 비교해
          # 실제로 달라졌을 때만 push 한다(휴장일 헛배포 방지).
          published=/tmp/published
          mkdir -p "$published"
          if git fetch --depth=1 origin gh-pages 2>/dev/null; then
            for f in markets.json indicators.json; do
              git show "FETCH_HEAD:data/$f" > "$published/$f" 2>/dev/null || true
            done
          fi

          while python3 scripts/wait_next_tick.py --until "$UNTIL"; do
            stamp="$(TZ=Asia/Seoul date +%H:%M)"

            if ! python3 scripts/fetch_markets.py --quick \
              || ! python3 scripts/fetch_indicators.py --quick; then
              echo "::warning::$stamp 수집 실패 — 이번 눈금 건너뜀"
              continue
            fi

            if ! python3 scripts/check_data.py; then
              echo "::warning::$stamp 데이터 검사 실패 — 배포하지 않음"
              continue
            fi

            if [ "$(python3 scripts/changed_since.py "$published")" != "true" ]; then
              echo "$stamp 변경 없음 — 배포 생략"
              continue
            fi

            # peaceiris/actions-gh-pages 의 force_orphan 과 같은 동작을 직접 한다
            # (스텝 안에서 반복하는 구조라 액션을 호출할 수 없다).
            rm -rf /tmp/pages
            cp -r docs /tmp/pages
            touch /tmp/pages/.nojekyll
            git -C /tmp/pages init -q -b gh-pages
            git -C /tmp/pages add -A
            git -C /tmp/pages \
              -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "deploy: 장중 갱신 $stamp KST"
            git -C /tmp/pages push -q --force \
              "https://x-access-token:$GH_TOKEN@github.com/$REPO.git" gh-pages

            cp docs/data/markets.json docs/data/indicators.json "$published/"
            echo "$stamp 배포 완료"
          done
